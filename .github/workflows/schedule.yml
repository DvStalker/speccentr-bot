name: SpecCentr News Bot

on:
  schedule:
    # Каждые 6 часов: 7:00, 13:00, 19:00, 01:00 (UTC+3 = UTC-3ч)
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:  # Ручной запуск из GitHub

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: news_bot.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Fetch news and send drafts
        env:
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:         ${{ secrets.CHANNEL_ID }}
          OWNER_CHAT_ID:      ${{ secrets.OWNER_CHAT_ID }}
          BOT_USERNAME:       ${{ secrets.BOT_USERNAME }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_POSTS_PER_RUN:  "3"
        run: python speccentr_news_bot.py fetch

  poll-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: news_bot.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Run bot polling (55 min)
        env:
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:         ${{ secrets.CHANNEL_ID }}
          OWNER_CHAT_ID:      ${{ secrets.OWNER_CHAT_ID }}
          BOT_USERNAME:       ${{ secrets.BOT_USERNAME }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          timeout 3300 python speccentr_news_bot.py poll || true
