name: SpecCentr News Bot

on:
  schedule:
    # Каждый четверг в 9:00 по Москве (UTC+3 → 06:00 UTC)
    - cron: "0 6 * * 4"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Запрещаем параллельный запуск — только один экземпляр одновременно
    concurrency:
      group: speccentr-bot
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: news_bot.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Fetch news + send drafts
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:        ${{ secrets.CHANNEL_ID }}
          OWNER_CHAT_ID:     ${{ secrets.OWNER_CHAT_ID }}
          BOT_USERNAME:      ${{ secrets.BOT_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_POSTS_PER_RUN: "3"
        run: python speccentr_news_bot.py fetch

      - name: Poll for button presses (55 min)
        env:
          BOT_TOKEN:         ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID:        ${{ secrets.CHANNEL_ID }}
          OWNER_CHAT_ID:     ${{ secrets.OWNER_CHAT_ID }}
          BOT_USERNAME:      ${{ secrets.BOT_USERNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: timeout 3300 python speccentr_news_bot.py poll || true
